name: deploy docs

# Builds the docs site (site/) into a Docker image, pushes it to GHCR, and
# rolls out the `docs` service on the shared VPS (defined in the app repo's
# docker-compose.prod.yml, proxied by Caddy at DOCS_DOMAIN → docs:3000).
# Runs only on a push to master that touched site/.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.prefix.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io requires the owner in lower-case; matches the app repo's IMAGE_PREFIX.
      - id: prefix
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mockingpug" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: site
          file: site/Dockerfile
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_DOCS_URL }}
          tags: |
            ${{ steps.prefix.outputs.prefix }}-docs:latest
            ${{ steps.prefix.outputs.prefix }}-docs:${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll out docs service
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mockingpug' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          # Log into GHCR on the VPS (token lives only for this job) so it can pull the docs image.
          printf '%s' "$GHCR_TOKEN" | $SSH "$SSH_TARGET" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "$SSH_TARGET" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          trap 'docker logout ghcr.io >/dev/null' EXIT
          dc pull docs
          dc up -d --no-deps --wait --wait-timeout 120 docs
          dc ps docs
          docker image prune -f >/dev/null
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
